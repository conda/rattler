[build-system]
requires = ["maturin>=1.14.0,<2.0"]
build-backend = "maturin"

[project]
name = "py-rattler"
version = "0.29.0"
requires-python = ">=3.10"
description = "A blazing fast library to work with the conda ecosystem"
readme = "README.md"
authors = [
  { name = "Bas Zalmstra", email = "zalmstra.bas@gmail.com" },
  { name = "Tarun Pratap Singh", email = "pratapsinghtarun9@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Typing :: Typed",
]
license = "BSD-3-Clause"

[project.optional-dependencies]
networkx = ["networkx"]

[project.urls]
Homepage = "https://github.com/conda/rattler"
Documentation = "https://conda.github.io/rattler/py-rattler/"
Repository = "https://github.com/conda/rattler"
Issues = "https://github.com/conda/rattler/labels/python-bindings"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "E4",   # pycodestyle imports
  "E7",   # pycodestyle statements
  "E9",   # pycodestyle runtime errors
  "F",    # Pyflakes
  "FURB", # refurb
  "I",    # isort
  "PERF", # Perflint
  "PIE",  # flake8-pie
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
]
ignore = [
  "SIM105", # contextlib.suppress is not always clearer than try-except-pass
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["B008"] # Function-call defaults are part of the Typer CLI definitions
"tests/**" = [
  "B017",  # Bindings can expose exception types that vary across platforms
  "RUF012", # Test-local process starter classes use mutable class attributes as configuration
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["rattler", "tests", "examples"]

[tool.ty.analysis]
# The compiled PyO3 extension module ships no type stubs.
allowed-unresolved-imports = ["rattler.rattler"]
