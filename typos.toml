[files]
extend-exclude = [
  ".git/",
  ".pixi/",
  "*.html",
  "*.json",
  "*.svg",
  "**/*.snap",
  "**/*.txt",
  "crates/rattler_libsolv_c",
  "test-data",
  "crates/*/CHANGELOG.md", # generated by release-plz from commit messages
  "crates/rattler_index/tests/test_index.rs",
  "js-rattler/src/PackageName.test.ts", # complains about valid test names in strings
]
ignore-hidden = false

[default.extend-words]
strat = "strat"
haa = "haa"
intoto = "intoto"
certifi = "certifi"
ACCES = "ACCES"     # NFS3ERR_ACCES / libc::EACCES
NFS3ERR_ACCES = "NFS3ERR_ACCES"
