[package]
name = "rattler_conda_lock"
version = "0.1.0"
edition.workspace = true
authors = ["Bas Zalmstra <4995967+baszalmstra@users.noreply.github.com>"]
description = "Read and write CEP-37 conda lockfiles with source-aware diagnostics"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = []

[dependencies]
hex = { workspace = true }
jiff = { workspace = true }
miette = { workspace = true, optional = true }
pep440_rs = { workspace = true }
pep508_rs = { workspace = true }
rattler_conda_types = { workspace = true, default-features = false }
rattler_digest = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-json-python-formatter = { workspace = true }
serde-saphyr = { workspace = true }
serde-untagged = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
insta = { workspace = true }
# `fancy-no-syscall` renders without probing the terminal, so snapshots do not
# depend on where the tests run.
miette = { workspace = true, features = ["fancy-no-syscall"] }
# Snapshot the diagnostics the way a caller with the `miette` feature sees them.
rattler_conda_lock = { path = ".", features = ["miette"] }
rattler_digest = { workspace = true, default-features = false }
rstest = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
