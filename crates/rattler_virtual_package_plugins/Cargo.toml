[package]
description = "Detect virtual packages using channel-provided detection plugins"
edition.workspace = true
license.workspace = true
name = "rattler_virtual_package_plugins"
repository.workspace = true
version = "0.1.0"

[features]
experimental-virtual-package-plugins = [
  "rattler_conda_types/experimental-virtual-package-plugins",
  "dep:async-trait",
  "dep:fs-err",
  "dep:hex",
  "dep:rattler",
  "dep:rattler_cache",
  "rattler_cache/experimental-virtual-package-plugins",
  "dep:rattler_digest",
  "dep:rattler_repodata_gateway",
  "rattler_repodata_gateway/experimental-virtual-package-plugins",
  "dep:rattler_shell",
  "dep:rattler_solve",
  "dep:rattler_virtual_packages",
  "dep:tokio",
  "dep:tracing",
]

[dependencies]
async-trait = { workspace = true, optional = true }
fs-err = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
indexmap = { workspace = true }
rattler = { workspace = true, default-features = false, optional = true }
rattler_cache = { workspace = true, default-features = false, optional = true }
rattler_conda_types = { workspace = true }
rattler_digest = { workspace = true, default-features = false, optional = true }
rattler_repodata_gateway = { workspace = true, default-features = false, features = [
  "gateway",
], optional = true }
rattler_shell = { workspace = true, optional = true }
rattler_solve = { workspace = true, default-features = false, features = [
  "resolvo",
], optional = true }
rattler_virtual_packages = { workspace = true, default-features = false, optional = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "rt",
  "time",
], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
fs-err = { workspace = true }
insta = { workspace = true }
rattler_cache = { workspace = true, default-features = false }
rattler_repodata_gateway = { workspace = true, default-features = false, features = [
  "gateway",
] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
url = { workspace = true }
