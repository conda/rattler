[package]
name = "rattler_virtual_package_detectors"
version = "0.1.0"
edition.workspace = true
authors = ["Julian Hofer <julian@prefix.dev>"]
description = "Run channel-registered virtual package detectors following the detector protocol CEP"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
async-trait = { workspace = true }
fs-err = { workspace = true, features = ["tokio"] }
futures = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
rattler = { workspace = true, default-features = false }
rattler_cache = { workspace = true, default-features = false }
rattler_conda_types = { workspace = true, default-features = false }
rattler_config = { workspace = true, default-features = false }
rattler_digest = { workspace = true, default-features = false, features = ["serde"] }
rattler_networking = { workspace = true, default-features = false }
rattler_prefix_guard = { workspace = true }
rattler_repodata_gateway = { workspace = true, default-features = false, features = ["gateway"] }
rattler_shell = { workspace = true }
rattler_solve = { workspace = true, default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
insta = { workspace = true }
jiff = { workspace = true }
rattler_index = { workspace = true }
rattler_package_streaming = { workspace = true, default-features = false }
rattler_repodata_gateway = { workspace = true, default-features = false, features = ["gateway", "rustls"] }
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
