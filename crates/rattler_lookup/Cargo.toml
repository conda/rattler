[package]
name = "rattler_lookup"
version = "0.1.0"
edition.workspace = true
authors = []
description = "Reading and writing the lookup index of a conda channel: which artifacts contain a file?"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async_http_range_reader = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
parquet = { workspace = true }
rattler_conda_types = { workspace = true, default-features = false }
rattler_digest = { workspace = true, default-features = false }
reqwest = { workspace = true, default-features = false }
reqwest-middleware = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
insta = { workspace = true, features = ["json"] }
reqwest = { workspace = true, default-features = false, features = ["rustls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["fs"] }
