[package]
name = "rattler_sigstore"
version = "0.1.0"
edition.workspace = true
authors = ["Wolf Vollprecht <w.vollprecht@gmail.com>"]
description = "Discovery, retrieval and verification of Sigstore attestations for conda packages"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = ["rustls"]
rustls = ["reqwest/rustls", "sigstore-verify/rustls"]
native-tls = ["reqwest/native-tls", "sigstore-verify/native-tls"]

[dependencies]
futures = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
rattler_conda_types = { workspace = true, default-features = false }
rattler_digest = { workspace = true, default-features = false }
reqwest = { workspace = true, default-features = false, features = ["stream"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sigstore-types = { workspace = true }
sigstore-verify = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["fs"] }
