[package]
name = "rattler-bin"
version = "0.2.6"
edition.workspace = true
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>"]
description = "Rust binary for common Conda operations"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
default-run = "rattler"

[[bin]]
name = "rattler"
path = "src/main.rs"

[features]
default = ["rustls", "s3", "gcs", "azure", "oauth"]
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_repodata_gateway/native-tls",
  "rattler_networking/native-tls",
  "rattler_cache/native-tls",
  "rattler_upload/native-tls",
]
rustls = [
  "reqwest/rustls",
  "rattler/rustls",
  "rattler_repodata_gateway/rustls",
  "rattler_networking/rustls",
  "rattler_cache/rustls",
  "rattler_upload/rustls",
]
s3 = ["rattler_networking/s3", "rattler_upload/s3"]
gcs = ["rattler_networking/gcs"]
azure = ["rattler_networking/azure", "rattler_upload/azure"]
oauth = ["rattler/oauth"]

[dependencies]
anyhow = { workspace = true }
jiff = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
console = { workspace = true, features = ["windows-console-colors"] }
futures-util = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
indicatif = { workspace = true }
miette = { workspace = true }
once_cell = { workspace = true }
rattler = { workspace = true, features = ["indicatif", "cli-tools", "auth-interactive"] }
rattler_conda_types = { workspace = true, default-features = false }
rattler_index = { workspace = true, default-features = false }
rattler_networking = { workspace = true, default-features = false, features = [
  "system-integration",
  "netrc-rs",
] }
rattler_repodata_gateway = { workspace = true, default-features = false, features = [
  "gateway",
] }
rattler_solve = { workspace = true, default-features = false, features = [
  "resolvo",
  "libsolv_c",
] }
rattler_virtual_packages = { workspace = true, default-features = false }
rattler_cache = { workspace = true, default-features = false }
rattler_menuinst = { workspace = true, default-features = false }
rattler_package_streaming = { workspace = true, default-features = false, features = [
  "reqwest",
] }
# Default features off, stated explicitly rather than inherited from the
# workspace dependency, so this crate's own `s3` / `azure` flags remain the only
# thing that compiles in the S3 and Azure upload backends.
#
# Defaults being off also meant none of `rattler_upload`'s own default features
# reached it: neither its TLS forwarding nor `sigstore-sign`, so `rattler upload`
# rejected `--attestation` outright. https kept working only because feature
# unification enabled `reqwest`'s TLS from the sibling rattler crates — a
# coincidence of the dependency graph, not something this crate asked for. TLS is
# now forwarded from the `rustls` / `native-tls` features above so it is chosen
# rather than inherited, and `sigstore-sign` is unconditional because
# attestations have no flag of their own to gate them.
rattler_upload = { workspace = true, default-features = false, features = [
  "sigstore-sign",
] }
rattler_shell = { workspace = true, default-features = false }
reqwest = { workspace = true, features = ["stream", "query"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
itertools = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
dunce = { workspace = true }
regex = { workspace = true }
