[package]
exclude = ["**/snapshots/**"]
name = "rattler_lock"
version = "0.34.0"
edition.workspace = true
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>"]
description = "Rust data types for conda lock"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Enables conversion between pixi lock files and CEP-37 (`conda-lock.yml`)
# lock files through the `conda_lock` module.
conda-lock = ["dep:rattler_conda_lock"]

[dependencies]
ahash = { workspace = true }
jiff = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
itertools = { workspace = true }
rattler_conda_lock = { workspace = true, optional = true }
rattler_conda_types = { workspace = true, default-features = false }
rattler_digest = { workspace = true, default-features = false }
rattler_solve = { workspace = true, default-features = false, features = ["serde"] }
file_url = { workspace = true }
pep508_rs = { workspace = true }
pep440_rs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
serde_with = { workspace = true, features = ["indexmap_2"] }
serde-untagged = { workspace = true }
serde_repr = { workspace = true }
serde-value = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
typed-path = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }

[dev-dependencies]
insta = { workspace = true, features = ["yaml"] }
# `fancy-no-syscall` renders without probing the terminal, so snapshots do not
# depend on where the tests run.
miette = { workspace = true, features = ["fancy-no-syscall"] }
# Snapshot conversion diagnostics the way a caller with the `miette` feature
# of rattler_conda_lock sees them.
rattler_conda_lock = { workspace = true, features = ["miette"] }
serde_json = { workspace = true }
similar-asserts = { workspace = true }
rstest = { workspace = true }

[[test]]
name = "conda_lock_conversion"
required-features = ["conda-lock"]

[[test]]
name = "conda_lock_errors"
required-features = ["conda-lock"]
