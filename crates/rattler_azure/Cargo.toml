[package]
name = "rattler_azure"
version = "0.1.0"
description = "A crate to streamline interaction with Azure Blob storage for rattler"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme.workspace = true

[features]
default = []
# CLI credential options; resolving them may mint a short-lived user-delegation
# SAS by shelling out to the Azure CLI (which needs `jiff` for the expiry).
clap = ["dep:clap", "dep:jiff"]
# Serialize/deserialize support for the credential types.
serde = ["dep:serde", "serde/derive"]

[dependencies]
clap = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
thiserror = { workspace = true }
url = { workspace = true }

serde = { workspace = true, optional = true }
