[package]
name = "rattler_azure"
version = "0.1.0"
description = "A crate to streamline interaction with Azure Blob storage for rattler"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme.workspace = true

[features]
default = []
# CLI credential options; resolving them may mint a short-lived user-delegation
# SAS by shelling out to the Azure CLI (which needs `jiff` for the expiry and
# `tokio` to run `az` without blocking the async runtime).
clap = ["dep:clap", "dep:jiff", "dep:which", "dep:tokio"]
# `azblob_config`: build an opendal `AzblobConfig` from a channel URL.
opendal = ["dep:opendal", "dep:percent-encoding"]
# Serde derives for the `azure-options` config table: the per-host endpoint
# options and the `AzureHost` used as their map key. The types themselves are
# always compiled; only the derives are gated. Pulls in `serde` alone, so config
# crates can depend on this crate with default features off.
serde = ["dep:serde"]

[dependencies]
clap = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
opendal = { workspace = true, default-features = false, features = [
  "services-azblob",
], optional = true }
percent-encoding = { workspace = true, optional = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"], optional = true }
url = { workspace = true }
which = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }
