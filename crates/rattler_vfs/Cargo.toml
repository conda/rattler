[package]
name = "rattler_vfs"
version = "0.1.0"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { workspace = true, features = ["derive"] }
libc = "0.2"

memchr = { workspace = true }
memmap2 = { workspace = true }
sha2 = { workspace = true }

nfs3_server = "0.5"
nfs3_types = "0.3.4"

tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time"] }
tempfile = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_cache = { workspace = true }
rattler_lock = { workspace = true }
rattler_networking = { workspace = true }

# compio's default io_uring driver ships prebuilt bindings that don't cover
# 32-bit arm or s390x; fall back to the polling (epoll) driver there.
[target.'cfg(not(any(target_arch = "arm", target_arch = "s390x")))'.dependencies]
compio = { version = "0.18", features = ["runtime", "macros", "signal"] }

[target.'cfg(any(target_arch = "arm", target_arch = "s390x"))'.dependencies]
compio = { version = "0.18", default-features = false, features = [
    "runtime",
    "macros",
    "signal",
    "polling",
] }
