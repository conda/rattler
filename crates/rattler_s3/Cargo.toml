[package]
name = "rattler_s3"
version = "0.2.16"
description = "A crate to streamline interaction with S3 storage for rattler"
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme.workspace = true

[features]
default = ["rustls"]
# Note: aws-smithy-http-client does not support native-tls, only rustls variants.
# This feature is provided for API compatibility with other rattler crates but
# will use rustls under the hood.
native-tls = ["rustls"]
rustls = ["aws-smithy-http-client/rustls-aws-lc", "opendal?/reqwest-rustls-tls"]
# Build `opendal` S3 operators that sign their requests with credentials of this
# crate, see `S3CredentialSource::opendal_builder`.
opendal = ["dep:opendal", "dep:reqsign-aws-v4", "dep:reqsign-core"]

[dependencies]
clap = { workspace = true, optional = true }
thiserror = { workspace = true }
url = { workspace = true }

aws-config = { workspace = true, features = [
  "sso",
  "credentials-process",
  "rt-tokio",
  "credentials-login",
  "default-https-client",
] }
aws-sdk-s3 = { workspace = true, features = ["rt-tokio", "default-https-client"] }
aws-smithy-http-client = { workspace = true }
aws-credential-types = { workspace = true }

rattler_networking = { workspace = true, default-features = false, features = ["s3"] }

opendal = { workspace = true, optional = true, features = ["services-s3"] }
reqsign-aws-v4 = { workspace = true, optional = true }
reqsign-core = { workspace = true, optional = true }

serde = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
