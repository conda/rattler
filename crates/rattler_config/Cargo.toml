[package]
exclude = ["**/snapshots/**", "test-data/**"]
name = "rattler_config"
version = "0.6.2"
edition.workspace = true
authors = []
description = "A crate to configure rattler and derived tools."
categories.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
edit = []
default = ["edit"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = { workspace = true }
dirs = { workspace = true }
fs-err = { workspace = true }
indexmap = { workspace = true }
# Default features off: this pulls in only `serde`, so the config crate stays
# free of the networking/opendal/CLI weight behind the azure feature flags.
rattler_azure = { workspace = true, default-features = false, features = [
  "serde",
] }
rattler_conda_types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_ignored = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
