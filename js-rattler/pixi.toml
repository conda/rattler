[workspace]
name = "js-rattler"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-aarch64", "win-64", "osx-arm64", "linux-64"]

[tasks]
_install = { cmd = "npm install", inputs = ["package.json", "package-lock.json"], outputs = ["node_modules/.package-lock.json"] }

# Building tasks
build = { cmd="npm run build", depends-on = ["_install"] }
build-types = { cmd="npm run build:types", depends-on = ["_install"] }
build-debug = { cmd="npm run build:wasm:debug", depends-on = ["_install"] }

# Formatting tasks
fmt = { cmd="npm run fmt", depends-on = ["_install"] }
fmt-check = { cmd="npm run fmt", depends-on = ["_install"] }

## Packing tasks
pack = { cmd="npm pack", depends-on = ["build"] }

## Testing tasks
test = { cmd="npm run test", depends-on = ["build","build-types"] }
test-debug = { cmd="npm run test:debug", depends-on = ["build-debug", "build-types"] }

[dependencies]
nodejs = ">=25.7.0,<25.8"
rust = ">=1.94.0,<1.95"
rust-std-wasm32-unknown-unknown = ">=1.94.0,<2"
wasm-pack = ">=0.14.0,<0.15"
zstd = ">=1.5.7,<2"
clang = ">=22.1.0,<23"

[feature.docs.dependencies]
python = "3.12.*"
"ruamel.yaml" = "*"
mdx_truly_sane_lists = "*"

[feature.docs.pypi-dependencies]
zensical = "*"
mike = { git = "https://github.com/squidfunk/mike.git" }

[feature.docs.tasks]
_typedoc = { cmd = "npx typedoc", depends-on = ["build-debug"] }
_gen-nav = { cmd = "python docs/scripts/generate_nav.py", depends-on = ["_typedoc"] }
docs = { cmd = "zensical serve", depends-on = ["_gen-nav"], description = "Serve the docs locally" }
build-docs = { cmd = "zensical build --strict", depends-on = ["_gen-nav"] }
deploy-latest = { cmd = "mike deploy --push --update-aliases $RELEASE_VERSION latest", depends-on = ["_gen-nav"] }
deploy-dev = { cmd = "mike deploy --push dev devel", depends-on = ["_gen-nav"] }

[environments]
default = ["default"]
docs = ["default", "docs"]
