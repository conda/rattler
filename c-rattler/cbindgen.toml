language = "C"
include_guard = "RATTLER_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"
header = """
/*
 * C bindings to rattler (https://github.com/conda/rattler).
 *
 * This file is generated by cbindgen, do not edit it manually.
 * Regenerate it by running `pixi run generate-header` in `c-rattler/`.
 */"""

[export]
prefix = ""
include = ["RattlerStatus", "RattlerParseStrictness"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
