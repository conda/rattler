body:
  - type: markdown
    attributes:
      value: |
        To mitigate spam, rattler only accepts pull requests from vouched contributors, see [CONTRIBUTING.md](https://github.com/conda/rattler/blob/main/CONTRIBUTING.md).
        If you are already vouched for another project using the shared registry, such as [Pixi](https://github.com/prefix-dev/pixi), you don't need to request it again.
        A vouch is not approval of a specific change: still agree on it with a maintainer before opening a pull request.
        If you don't get a response within a week, please ping us on [Discord](https://discord.gg/kKV8ZxyzY4).
  - type: textarea
    id: motivation
    attributes:
      label: Please briefly introduce yourself and why you want to contribute. Do not use an AI for this.
    validations:
      required: true
