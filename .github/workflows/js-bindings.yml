name: JS bindings CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # When we change pyproject.toml, we want to ensure that the maturin builds still work
      - test-data/**
      - crates/**
      - Cargo.*

      # When something in the bindings themselves changes
      - "js-rattler/**/*"

      # Or when this workflow changes
      - ".github/workflows/js-bindings.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_LOG: info
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings --cfg getrandom_backend=\"wasm_js\""

jobs:
  format_lint_test:
    name: Format, Lint and Test the JS bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: js-rattler/pixi.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js-rattler
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run rustfmt
        working-directory: js-rattler
        run: pixi run cargo fmt --all --check

      - name: Run clippy
        working-directory: js-rattler
        run: pixi run cargo clippy --locked --all-targets

      - name: Check formatting
        working-directory: js-rattler
        run: pixi run fmt-check

      - name: Build and test
        working-directory: js-rattler
        run: pixi run test

      # some e2e test to make sure our build works
      - run: |
          set -euxo pipefail

          node ./e2e/main.cjs
          node ./e2e/main.mjs
        working-directory: js-rattler
