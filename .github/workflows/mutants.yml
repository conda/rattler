on:
  pull_request:
    paths:
      - crates/rattler_conda_version/**
      - crates/rattler_conda_types/**
      - crates/rattler_lock/**
      - crates/rattler_digest/**
      - .cargo/mutants.toml
      - .github/workflows/mutants.yml

name: Mutants

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Snapshot mismatches must fail the tests instead of writing new snapshots.
  INSTA_UPDATE: "no"

jobs:
  mutants-in-diff:
    name: Mutation testing (changed code)
    runs-on: ubuntu-latest
    # Advisory only: missed mutants point at untested code but do not block merging.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          environments: mutants
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Compute diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" > git.diff
      - name: Run cargo-mutants on changed code
        run: pixi run -e mutants mutants --no-shuffle --in-diff git.diff
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
