name: Detect breaking changes - Comment

# This workflow only reads the artifact of the trusted `Detect breaking changes`
# run and posts a comment; it never checks out or executes PR code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Detect breaking changes]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Fork runs can omit pull_requests, so use one conservative fallback group.
  group: >-
    breaking-changes-comment-${{
      github.event.workflow_run.pull_requests[0].number ||
      'unassociated'
    }}
  cancel-in-progress: false

jobs:
  comment-on-pr:
    name: Comment on pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      # workflow_run uses the trusted default-branch implementation. It must not
      # check out or execute pull-request-controlled code.
      - name: Checkout trusted comment script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          environments: semver-check

      - name: Download result artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: semver-check-result
          path: semver-artifact
          run-id: ${{ github.event.workflow_run.id }}

      - name: Update pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: pixi run -e semver-check update-breaking-change-comment semver-artifact
