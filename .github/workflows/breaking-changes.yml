name: Detect breaking changes

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: breaking-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-semver:
    name: Check semver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          submodules: recursive

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: semver-check

      - name: Install Rust toolchain
        run: rustup show

      # Keep this version aligned with the release-plz action.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run cargo-semver-checks
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.sha }}
        # HEAD is GitHub's synthetic merge commit. Its first parent is the exact
        # base revision used for this run.
        run: pixi run -e semver-check breaking-changes ci "HEAD^1" semver-artifact

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: semver-check-result
          path: semver-artifact/
          retention-days: 1
