name: Check PR

# `pull_request_target` is needed to label/close PRs from forks. The workflow
# never checks out or executes PR code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/recheck'))
    steps:
      - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        id: check-pr
        with:
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          auto-close: true
          vouched-repo: prefix-dev/vouched
          vouched-file: VOUCHED.td
          require-vouch: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label PR
        if: steps.check-pr.outputs.status == 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['denounced']
            })
